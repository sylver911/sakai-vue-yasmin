  /api/auth/activity-logs/:
    get:
      operationId: auth_activity_logs_list
      parameters:
      - in: query
        name: action
        schema:
          type: string
          title: Művelet
          enum:
          - create
          - delete
          - login
          - logout
          - status_change
          - update
          - view
        description: |-
          * `create` - Létrehozás
          * `update` - Módosítás
          * `delete` - Törlés
          * `view` - Megtekintés
          * `login` - Bejelentkezés
          * `logout` - Kijelentkezés
          * `status_change` - Státuszváltás
      - in: query
        name: entity_type
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: user
        schema:
          type: integer
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActivityLogList'
          description: ''
