components:
  schemas:
    ActionEnum:
      enum:
      - create
      - update
      - delete
      - view
      - login
      - logout
      - status_change
      type: string
      description: |-
        * `create` - Létrehozás
        * `update` - Módosítás
        * `delete` - Törlés
        * `view` - Megtekintés
        * `login` - Bejelentkezés
        * `logout` - Kijelentkezés
        * `status_change` - Státuszváltás
    ActivityLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          type: integer
          nullable: true
          title: Felhasználó
        user_name:
          type: string
          readOnly: true
          nullable: true
        action:
          allOf:
          - $ref: '#/components/schemas/ActionEnum'
          title: Művelet
        action_display:
          type: string
          readOnly: true
        entity_type:
          type: string
          title: Entitás típus
          maxLength: 50
        entity_id:
          type: string
          format: uuid
          nullable: true
          title: Entitás ID
        entity_name:
          type: string
          title: Entitás név
          maxLength: 255
        details:
          title: Részletek
        ip_address:
          type: string
          nullable: true
          title: IP cím
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - action_display
      - created_at
      - entity_type
      - id
      - user_name
    AddressTypeEnum:
      enum:
      - billing
      - shipping
      - headquarters
      - branch
      type: string
      description: |-
        * `billing` - Számlázási cím
        * `shipping` - Szállítási cím
        * `headquarters` - Székhely
        * `branch` - Telephely
    Attachment:
      type: object
      description: Serializer for attachments.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        order:
          type: string
          format: uuid
          nullable: true
          title: Megrendelés
        customer:
          type: string
          format: uuid
          nullable: true
          title: Ügyfél
        file:
          type: string
          format: uri
          title: Fájl
        original_filename:
          type: string
          title: Eredeti fájlnév
          maxLength: 255
        file_size:
          type: integer
          readOnly: true
          title: Fájlméret (byte)
        file_size_formatted:
          type: string
          readOnly: true
        mime_type:
          type: string
          readOnly: true
          title: MIME típus
        extension:
          type: string
          readOnly: true
        is_image:
          type: boolean
          readOnly: true
        is_pdf:
          type: boolean
          readOnly: true
        attachment_type:
          type: string
          format: uuid
          nullable: true
          title: Típus
        attachment_type_data:
          allOf:
          - $ref: '#/components/schemas/AttachmentType'
          readOnly: true
        description:
          type: string
          title: Leírás
          maxLength: 500
        is_public:
          type: boolean
          title: Publikus
        download_url:
          type: string
          readOnly: true
        uploaded_by:
          type: integer
          readOnly: true
          nullable: true
          title: Feltöltötte
        uploaded_by_name:
          type: string
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - attachment_type_data
      - created_at
      - download_url
      - extension
      - file
      - file_size
      - file_size_formatted
      - id
      - is_image
      - is_pdf
      - mime_type
      - original_filename
      - updated_at
      - uploaded_by
      - uploaded_by_name
    AttachmentRequest:
      type: object
      description: Serializer for attachments.
      properties:
        order:
          type: string
          format: uuid
          nullable: true
          title: Megrendelés
        customer:
          type: string
          format: uuid
          nullable: true
          title: Ügyfél
        file:
          type: string
          format: binary
          title: Fájl
        original_filename:
          type: string
          minLength: 1
          title: Eredeti fájlnév
          maxLength: 255
        attachment_type:
          type: string
          format: uuid
          nullable: true
          title: Típus
        description:
          type: string
          title: Leírás
          maxLength: 500
        is_public:
          type: boolean
          title: Publikus
      required:
      - file
      - original_filename
    AttachmentType:
      type: object
      description: Serializer for attachment types.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          title: Típus név
          maxLength: 100
        slug:
          type: string
          title: Azonosító
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        icon:
          type: string
          title: Ikon
          maxLength: 50
        color:
          type: string
          title: Szín
          maxLength: 7
        allowed_extensions:
          title: Engedélyezett kiterjesztések
          description: 'Pl: ["pdf", "jpg", "png"]'
        max_file_size:
          type: integer
          maximum: 2147483647
          minimum: 0
          title: Max fájlméret (MB)
        is_active:
          type: boolean
          title: Aktív
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - slug
      - updated_at
    AttachmentTypeCreate:
      type: object
      description: Serializer for creating attachment types.
      properties:
        name:
          type: string
          title: Típus név
          maxLength: 100
        slug:
          type: string
          title: Azonosító
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        icon:
          type: string
          title: Ikon
          maxLength: 50
        color:
          type: string
          title: Szín
          maxLength: 7
